apiVersion: 1

# Local webhook so no external paging credentials are committed. Point this at
# a receiver of your choice; the alert still fires in Grafana when the webhook
# is unreachable.
contactPoints:
  - orgId: 1
    name: agrivanta-local-webhook
    receivers:
      - uid: agrivanta-local-webhook
        type: webhook
        settings:
          url: http://127.0.0.1:9099/alerts
          httpMethod: POST
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: agrivanta-local-webhook
    group_by:
      - alertname
      - service
      - environment
      - deployed_version
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: agrivanta-local-webhook
        matchers:
          - alertname = AgrivantaRecordCreationFailures
        continue: false

groups:
  - orgId: 1
    name: agrivanta-product-alerts
    folder: Agrivanta
    interval: 1m
    rules:
      - uid: agrivanta-record-creation-failures
        title: Agrivanta record-creation failures
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                (
                  sum by (service, environment, deployed_version) (
                    increase(agrivanta_record_creation_failures_total[5m])
                  ) > bool 10
                )
                or
                (
                  (
                    sum by (service, environment, deployed_version) (
                      rate(agrivanta_record_creation_failures_total[5m])
                    )
                    /
                    clamp_min(
                      sum by (service, environment, deployed_version) (
                        rate(agrivanta_record_creation_failures_total[5m])
                      )
                      +
                      sum by (service, environment, deployed_version) (
                        rate(agrivanta_records_created_total[5m])
                      ),
                      0.000001
                    )
                  ) > bool 0.05
                )
              instant: true
              intervalMs: 60000
              legendFormat: "{{service}} {{environment}} {{deployed_version}}"
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: >-
            Sustained record-creation failures for {{ $labels.service }} in
            {{ $labels.environment }} ({{ $labels.deployed_version }})
          description: >-
            More than 10 record-creation failures occurred in 5 minutes, or
            more than 5% of activity/expense/harvest/sale creates failed, for
            10 minutes. Users may be unable to record operations or financial
            data.
          service: "agrivanta-backend"
          environment: "{{ $labels.environment }}"
          deployed_version: "{{ $labels.deployed_version }}"
          owner: "agrivanta-backend"
          dashboard_url: >-
            http://localhost:3000/d/agrivanta-product-metrics/agrivanta-product-metrics?var-environment={{ $labels.environment }}&var-deployed_version={{ $labels.deployed_version }}
          runbook_url: >-
            https://github.com/TheRevenant04/agrivanta/blob/main/observability/README.md#alert-runbook-record-creation-failures
        labels:
          severity: warning
          owner: agrivanta-backend
          service: agrivanta-backend
