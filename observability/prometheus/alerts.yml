groups:
  - name: agrivanta-product-alerts
    rules:
      - alert: AgrivantaRecordCreationFailures
        # Fires when either:
        #   * more than 10 failed create requests occurred in 5 minutes, or
        #   * more than 5% of create attempts failed,
        # and the condition holds for 10 minutes.
        expr: |
          (
            sum by (service, environment, deployed_version) (
              increase(agrivanta_record_creation_failures_total[5m])
            ) > 10
          )
          or
          (
            (
              sum by (service, environment, deployed_version) (
                rate(agrivanta_record_creation_failures_total[5m])
              )
              /
              clamp_min(
                (
                  sum by (service, environment, deployed_version) (
                    rate(agrivanta_record_creation_failures_total[5m])
                  )
                  +
                  sum by (service, environment, deployed_version) (
                    rate(agrivanta_records_created_total[5m])
                  )
                ),
                0.000001
              )
            ) > 0.05
          )
        for: 10m
        labels:
          severity: warning
          owner: agrivanta-backend
          service: agrivanta-backend
        annotations:
          summary: >-
            Sustained record-creation failures for
            {{ $labels.service }} in {{ $labels.environment }}
            ({{ $labels.deployed_version }})
          description: >-
            More than 10 create failures occurred in 5 minutes or more than
            5% of activity/expense/harvest/sale creates failed for 10 minutes.
            Users may be unable to record operations or financial data.
          owner: agrivanta-backend
          dashboard_url: >-
            http://localhost:3000/d/agrivanta-product-metrics/agrivanta-product-metrics?var-environment={{ $labels.environment }}&var-deployed_version={{ $labels.deployed_version }}
          runbook_url: >-
            https://github.com/TheRevenant04/agrivanta/blob/main/observability/README.md#alert-runbook-record-creation-failures
