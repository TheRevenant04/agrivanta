        supplier:
          type: string
          description: Optional counterparty; an expense may exist without one.

    PaymentType:
      type: string
      enum: [received, paid]

    Payment:
      type: object
      required: [id, type, amount, date]
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/PaymentType'
        amount:
          type: number
        date:
          type: string
          format: date
        linkedExpenseId:
          type: [string, 'null']
