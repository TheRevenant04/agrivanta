        date:
          type: string
        note:
          type: string

    ExpenseCategory:
      type: string
      enum: [inputs, labour, equipment, overhead, other]

    ExpenseStatus:
      type: string
      enum: [draft, posted]

    Attachment:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
          description: Uploaded file name, shown on the saved expense.
        url:
          type: string

    Expense:
      type: object
      required: [id, category, amount, date, status]
      properties:
        id:
          type: string
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        amount:
          type: number
        date:
          type: string
          format: date
        supplier:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/ExpenseStatus'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        notes:
          type: [string, 'null']

    ExpenseInput:
      type: object
      required: [category, amount, date]
      properties:
