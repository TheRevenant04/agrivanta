          description: Quantity × unit price, computed by the backend.

    SaleInput:
      type: object
      required: [customerId, harvestId, quantity, unitPrice, date]
      properties:
        customerId:
          type: string
        harvestId:
          type: string
        quantity:
          $ref: '#/components/schemas/FlexibleNumber'
        unitPrice:
          $ref: '#/components/schemas/FlexibleNumber'
        date:
