        linkedSaleId:
          type: string
        reference:
          type: string

    Harvest:
      type: object
      required: [id, cycleId, quantity, unitId, date]
      properties:
        id:
          type: string
        cycleId:
          type: string
        quantity:
          type: number
        unitId:
          type: string
        date:
          type: string
          format: date

    HarvestInput:
      type: object
