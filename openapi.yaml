    InventoryItemInput:
      type: object
      required: [name, unitId, reorderLevel]
      properties:
        name:
          type: string
        unitId:
          type: string
        reorderLevel:
          $ref: '#/components/schemas/FlexibleNumber'

    StockMovementType:
      type: string
      enum: [purchase, usage, adjustment]

    StockMovement:
      type: object
      required: [id, itemId, type, quantity]
