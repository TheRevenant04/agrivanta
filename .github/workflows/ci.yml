name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agrivanta
          POSTGRES_USER: agrivanta
          POSTGRES_PASSWORD: agrivanta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrivanta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: agrivanta
      POSTGRES_USER: agrivanta
      POSTGRES_PASSWORD: agrivanta
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DJANGO_DEBUG: "1"
      REPORT_PDF_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run migrations
        run: uv run python backend/manage.py migrate --no-input

      - name: Install PDF dependencies
        run: uv pip install -r backend/requirements-pdf.txt

      - name: Diagnose PDF worker
        run: |
          cat > /tmp/diag.py <<'PY'
          import os
          import subprocess
          import sys
          import uuid
          from pathlib import Path

          from api.pdf_chromium import render_chromium_pdf

          runtime = Path("backend/.pdf-runtime") / uuid.uuid4().hex
          runtime.parent.mkdir(mode=0o700, exist_ok=True)
          runtime.mkdir(mode=0o700)
          env = os.environ.copy()
          env.update(TEMP=str(runtime), TMP=str(runtime), TMPDIR=str(runtime))
          proc = subprocess.run(
              [sys.executable, "backend/api/pdf_chromium_worker.py", "/usr/bin/google-chrome"],
              input=b"<p>hi</p>", capture_output=True, env=env,
              start_new_session=True,
          )
          print("worker rc", proc.returncode, "stdout", proc.stdout[:8], flush=True)
          print("worker stderr", proc.stderr.decode(errors="replace")[:6000], flush=True)

          try:
              data = render_chromium_pdf("<p>hi</p>")
              print("render ok", data[:8], flush=True)
          except Exception as exc:
              import traceback
              traceback.print_exc()
          PY
          PYTHONPATH=backend uv run --no-sync python /tmp/diag.py

      - name: Run backend tests
        run: uv run --no-sync pytest

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Run frontend tests
        run: npm test
