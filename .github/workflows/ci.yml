name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agrivanta
          POSTGRES_USER: agrivanta
          POSTGRES_PASSWORD: agrivanta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrivanta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: agrivanta
      POSTGRES_USER: agrivanta
      POSTGRES_PASSWORD: agrivanta
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DJANGO_DEBUG: "1"
      REPORT_PDF_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run migrations
        run: uv run python backend/manage.py migrate --no-input

      - name: Install PDF dependencies
        run: uv pip install -r backend/requirements-pdf.txt

      - name: Run backend tests
        run: |
          # Chromium's Linux singleton socket path is limited to 108 chars.
          # Bind-mount the workspace at a short path so the PDF runtime
          # directory under backend/.pdf-runtime stays within that limit.
          sudo mkdir -p /r
          sudo mount --bind "$GITHUB_WORKSPACE" /r
          cd /r
          uv run --no-sync pytest

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Run frontend tests
        run: npm test

  e2e:
    name: End-to-end success workflow
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agrivanta
          POSTGRES_USER: agrivanta
          POSTGRES_PASSWORD: agrivanta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrivanta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: agrivanta
      POSTGRES_USER: agrivanta
      POSTGRES_PASSWORD: agrivanta
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DJANGO_DEBUG: "1"
      AGRIVANTA_LLM_FAKE: "1"
      VITE_API_CLIENT: http
      VITE_API_BASE_URL: /api
      VITE_BASE: /static/

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install backend dependencies
        run: uv sync

      - name: Run migrations
        run: uv run python backend/manage.py migrate --no-input

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Copy frontend build to backend
        run: |
          mkdir -p backend/frontend_dist
          cp -r frontend/dist/* backend/frontend_dist/

      - name: Collect static files
        run: uv run python backend/manage.py collectstatic --no-input

      - name: Start Django backend server
        run: |
          uv run python backend/manage.py runserver 0.0.0.0:8000 &
          # Wait for server to become ready
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/healthz | grep -q ok; then
              echo "Backend is up"
              break
            fi
            sleep 1
          done

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

