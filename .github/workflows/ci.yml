name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agrivanta
          POSTGRES_USER: agrivanta
          POSTGRES_PASSWORD: agrivanta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrivanta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: agrivanta
      POSTGRES_USER: agrivanta
      POSTGRES_PASSWORD: agrivanta
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DJANGO_DEBUG: "1"
      REPORT_PDF_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run migrations
        run: uv run python backend/manage.py migrate --no-input

      - name: Install PDF dependencies
        run: uv pip install -r backend/requirements-pdf.txt

      - name: Diagnose PDF worker
        run: |
          cat > /tmp/diag.py <<'PY'
          import subprocess

          import django

          django.setup()

          import api.pdf_chromium as pc

          print("executable", pc._browser_executable(), flush=True)

          real_popen = subprocess.Popen

          class Spy:
              def __init__(self, *args, **kwargs):
                  print("SPY args", args, flush=True)
                  self.proc = real_popen(*args, **kwargs)
                  self.pid = self.proc.pid
                  self.returncode = None

              def communicate(self, *args, **kwargs):
                  out, err = self.proc.communicate(*args, **kwargs)
                  self.returncode = self.proc.returncode
                  print("SPY rc", self.proc.returncode, flush=True)
                  print("SPY stdout", out[:16], flush=True)
                  print("SPY stderr", err.decode(errors="replace")[:8000], flush=True)
                  return out, err

              def poll(self):
                  return self.proc.poll()

              def kill(self):
                  return self.proc.kill()

          pc.subprocess.Popen = Spy
          try:
              data = pc.render_chromium_pdf("<p>hi</p>")
              print("render ok", data[:8], flush=True)
          except Exception:
              import traceback
              traceback.print_exc()
          finally:
              pc.subprocess.Popen = real_popen
          PY
          DJANGO_SETTINGS_MODULE=config.settings PYTHONPATH=backend uv run --no-sync python /tmp/diag.py

      - name: Run backend tests
        run: uv run --no-sync pytest

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Run frontend tests
        run: npm test
