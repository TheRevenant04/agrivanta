name: CI

on:
  pull_request:
    branches: [main]

env:
  POSTGRES_DB: agrivanta
  POSTGRES_USER: agrivanta
  POSTGRES_PASSWORD: agrivanta
  DJANGO_SECRET_KEY: ci-secret-key-not-for-production

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agrivanta
          POSTGRES_USER: agrivanta
          POSTGRES_PASSWORD: agrivanta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrivanta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run backend unit tests
        run: uv run python -m pytest backend/api/tests/unit

  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Run frontend unit tests
        run: npx vitest run src/tests/unit

  verify:
    name: Integration and end-to-end tests
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: "1"
      REPORT_PDF_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      E2E_BASE_URL: http://127.0.0.1:5173
      E2E_API_BASE: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          prune-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Install backend dependencies
        run: uv sync

      - name: Install PDF dependencies
        run: uv pip install -r backend/requirements-pdf.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build Docker Compose stack
        run: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.ci.yml
          up -d --build --wait --wait-timeout 180

      - name: Run backend integration tests
        run: |
          # Chromium's Linux singleton socket path is limited to 108 chars.
          # Bind-mount the workspace at a short path so the PDF runtime
          # directory under backend/.pdf-runtime stays within that limit.
          sudo mkdir -p /r
          sudo mount --bind "$GITHUB_WORKSPACE" /r
          cd /r
          uv run --no-sync pytest backend/api/tests/integration

      - name: Run frontend integration tests
        working-directory: frontend
        run: npx vitest run src/tests/integration

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Dump Docker Compose logs on failure
        if: failure()
        run: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.ci.yml
          logs --no-color

      - name: Tear down Docker Compose stack
        if: always()
        run: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.ci.yml
          down -v

  # Aggregated gate: make this the required status check before merging to main.
  ci-success:
    name: CI success
    if: always()
    needs: [backend, frontend, verify]
    runs-on: ubuntu-latest

    steps:
      - name: Check all required jobs passed
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}; then
            echo "One or more required jobs did not pass."
            exit 1
          fi
          echo "All required jobs passed."
